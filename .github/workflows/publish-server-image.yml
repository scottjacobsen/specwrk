name: publish-server-image

# Build and push the Puma queue-server image (docker/Dockerfile.puma-server)
# to Docker Hub whenever the release branch moves. Tags: the 12-char commit
# sha (what consumers should pin) and `latest`.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - a Docker Hub access token with write scope

on:
  push:
    branches:
      - portal-fixes
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec standardrb
      - run: bundle exec rspec

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: shortsha
        run: echo "sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.puma-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/specwrk:${{ steps.shortsha.outputs.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/specwrk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
